name: Keep Backend Alive

# Keep-alive intercalado con UptimeRobot.
# UptimeRobot hace ping cada 5 minutos; este workflow se desfasará para cubrir huecos.
on:
  schedule:
    # Pings desfasados: 02, 07, 12, 17... y 07, 12, 17, 22...
    - cron: '2-59/10 * * * *'
    - cron: '7-59/10 * * * *'

  # Permitir ejecución manual desde GitHub Actions UI
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest

    env:
      HEALTH_URL: https://proyecto-realprint-v2.onrender.com/api/setup/status

    steps:
      - name: Ping backend health endpoint
        shell: bash
        run: |
          set -euo pipefail

          echo "🏓 Keep-alive contra backend: $HEALTH_URL"
          start_ts=$(date +%s)

          ping_backend() {
            local timeout="$1"
            response=$(curl -sS -w $'\n%{http_code}' --max-time "$timeout" "$HEALTH_URL" || true)
            http_code=$(printf '%s\n' "$response" | tail -n1)
            body=$(printf '%s\n' "$response" | sed '$d')

            echo "📊 Código HTTP: ${http_code:-timeout/sin_respuesta}"

            if [[ "$http_code" =~ ^2[0-9][0-9]$ || "$http_code" =~ ^3[0-9][0-9]$ ]]; then
              echo "📄 Respuesta: $body"
              return 0
            fi

            # Tratar como retryable mientras se inicia
            if [[ "$http_code" == "000" || -z "$http_code" || "$http_code" == "503" || "$http_code" == "404" ]]; then
              return 2
            fi

            return 1
          }

          # Reintentos: timeout + espera
          timeouts=(30 60 60)
          waits=(90 30 0)

          for i in "${!timeouts[@]}"; do
            attempt=$((i+1))
            echo "🔄 Intento ${attempt} (timeout: ${timeouts[$i]}s)..."

            if ping_backend "${timeouts[$i]}"; then
              end_ts=$(date +%s)
              echo "✅ Keep-alive exitoso"
              echo "⏱️ Tiempo total: $((end_ts - start_ts))s"
              exit 0
            fi

            rc=$?
            if [[ $rc -eq 2 && ${waits[$i]} -gt 0 ]]; then
              echo "❄️ Servidor no listo. Esperando ${waits[$i]}s..."
              sleep "${waits[$i]}"
            fi
          done

          end_ts=$(date +%s)
          echo "❌ Todos los intentos fallaron después de $((end_ts - start_ts))s"
          echo "🔍 Posibles causas: servidor caído o timeout excesivo"
          exit 1

      - name: Registro de ejecución
        if: always()
        run: |
          echo "⏰ Última ejecución: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "🔄 Siguiente ejecución: cron intercalado con UptimeRobot"

      # Opcional: Notificar si falla
      - name: Notificar fallo
        if: failure()
        run: |
          echo "❌ El backend no respondió correctamente"
          echo "🔍 Revisa los logs en Render: https://dashboard.render.com/"
